# LEADS production stack. Works on any host with Docker:
#
#   cp .env.prod.example .env.prod      # fill in the values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# The scraping engine (postgres, redis, migrate, seed, worker-crawl, worker-main, beat) starts
# by default. The web app is opt-in:  --profile web
#
# Rules: exactly ONE beat container. Scale workers, never beat:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --scale worker-crawl=2

x-python: &python
  build:
    context: ./leads-app/python-service
    dockerfile: ../../infra/docker/worker.Dockerfile
  image: leads-worker:latest
  restart: unless-stopped
  env_file: .env.prod
  environment: &python-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CELERY_TIMEZONE: Asia/Karachi
    DAILY_SCRAPE_HOUR: ${DAILY_SCRAPE_HOUR:-2}
    DAILY_SCRAPE_MINUTE: ${DAILY_SCRAPE_MINUTE:-0}
  depends_on: &python-deps
    seed:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # host only; never exposed to the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Runs once per deploy: applies pending migrations, then exits.
  migrate:
    build:
      context: ./leads-app
      dockerfile: ../infra/docker/migrate.Dockerfile
    image: leads-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  # Runs once per deploy: makes sure cities and portals exist in the config tables.
  seed:
    <<: *python
    restart: "no"
    command: ["python", "scripts/seed_config.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-crawl:
    <<: *python
    command: ["celery", "-A", "celery_app", "worker", "-Q", "crawl", "-c", "2", "--loglevel=info", "-n", "crawl@%h"]
    volumes:
      - crawl_logs:/app/logs
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d crawl@$$HOSTNAME -t 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  worker-main:
    <<: *python
    command: ["celery", "-A", "celery_app", "worker", "-Q", "default,intel,agents,messaging", "-c", "2", "--loglevel=info", "-n", "main@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d main@$$HOSTNAME -t 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # EXACTLY ONE. Never scale this service and never run workers with -B.
  beat:
    <<: *python
    command: ["celery", "-A", "celery_app", "beat", "--schedule", "/data/celerybeat-schedule", "--loglevel=info"]
    volumes:
      - beat_data:/data
    deploy:
      replicas: 1
    healthcheck:
      # beat rewrites its schedule file every few minutes while it is alive
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/celerybeat-schedule')<900 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    profiles: ["web"]
    build:
      context: ./leads-app
      dockerfile: ../infra/docker/web.Dockerfile
    image: leads-web:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/2
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  beat_data:
  crawl_logs:
