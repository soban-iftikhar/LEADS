name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leads-app
    env:
      # Build-time placeholders only; nothing connects during these steps.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leads-app/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Python (crawler and scheduler)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leads_user
          POSTGRES_PASSWORD: leads_password
          POSTGRES_DB: leads_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leads_user -d leads_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://leads_user:leads_password@localhost:5432/leads_test
      TEST_DATABASE_URL: postgresql://leads_user:leads_password@localhost:5432/leads_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply database migrations
        working-directory: leads-app
        run: |
          npm ci --ignore-scripts
          npx prisma migrate deploy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: leads-app/python-service/requirements.txt
      - name: Install
        working-directory: leads-app/python-service
        run: pip install -r requirements.txt ruff
      - name: Lint
        working-directory: leads-app/python-service
        run: ruff check .
      - name: Seed config and test
        working-directory: leads-app/python-service
        env:
          # Throwaway keys for CI only.
          PHONE_HASH_PEPPER: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          PHONE_ENC_KEY: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=
        run: |
          python scripts/seed_config.py
          pytest -q
